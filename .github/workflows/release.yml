name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue validation as well as publication; do not replace intermediate pushes.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Test release policy
        run: node --test scripts/release-test.mjs
      - name: Publish validated source release
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
