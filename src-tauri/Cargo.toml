[package]
name = "orchestr8"
version = "0.1.0"
description = "Native shell for the orchestr8 web UI"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orchestr8_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
